#!/usr/sbin/nft -f

# Crakbit Chain public-testnet example only.
# Review interfaces, management CIDRs and ports before using this on any host.
# Do not expose validator-internal RPC directly to the public Internet.

flush ruleset

table inet crakbit_filter {
  set management_ipv4 {
    type ipv4_addr
    flags interval
    elements = { 192.0.2.10/32 }
  }

  chain input {
    type filter hook input priority 0; policy drop;

    ct state established,related accept
    iifname "lo" accept

    # ICMP/ICMPv6 needed for normal network operation/PMTU.
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept

    # Administrative SSH: replace the documentation-only address above.
    ip saddr @management_ipv4 tcp dport 22 ct state new accept

    # Public reverse proxy only. The proxy should forward to a loopback/private RPC port.
    tcp dport { 80, 443 } ct state new accept

    # Optional validator mTLS listener: restrict this to known validator source ranges
    # at the provider firewall/VPC layer as well. Uncomment only after defining them.
    # ip saddr { 198.51.100.10, 198.51.100.11, 203.0.113.10 } tcp dport 9101 accept

    counter drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
