# Crakbit public-testnet edge profile (v0.17)
# Testnet/mainnet-candidate infrastructure only. This is not a complete WAF/DDoS solution.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format crakbit '$remote_addr - $request_method $uri $status $body_bytes_sent '
                         'rt=$request_time ua="$http_user_agent"';
    access_log /var/log/nginx/access.log crakbit;
    error_log /var/log/nginx/error.log warn;

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    client_max_body_size 256k;

    # A single shared edge process centralizes limits for all gateway replicas behind it.
    # Multi-edge deployments need an external/shared limiter; NGINX zones are process-host local.
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=tx_write:20m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=faucet_write:20m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=mining_write:20m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:20m;

    upstream crakbit_gateway {
        least_conn;
        server gateway:9600 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl http2;
        server_name _;

        # Mount operator-managed public-testnet certificates read-only into this path.
        ssl_certificate /run/secrets/tls/fullchain.pem;
        ssl_certificate_key /run/secrets/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        limit_conn per_ip_conn 20;

        location = /api/transactions {
            limit_req zone=tx_write burst=10 nodelay;
            proxy_pass http://crakbit_gateway;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        location = /api/faucet/request {
            limit_req zone=faucet_write burst=2 nodelay;
            proxy_pass http://crakbit_gateway;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        location ~ ^/api/mining/(challenge|submit)$ {
            limit_req zone=mining_write burst=10 nodelay;
            proxy_pass http://crakbit_gateway;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        location / {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://crakbit_gateway;
            include /etc/nginx/conf.d/proxy-common.conf;
        }
    }
}
