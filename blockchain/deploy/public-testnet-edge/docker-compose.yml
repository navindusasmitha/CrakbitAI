services:
  edge:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy-common.conf:/etc/nginx/conf.d/proxy-common.conf:ro
      - ${CRAKBIT_TLS_DIR:?set CRAKBIT_TLS_DIR to an operator-managed certificate directory}:/run/secrets/tls:ro
    networks:
      - public_edge

  # The actual Crakbit gateway may run in this Compose project or on an explicitly private
  # upstream network. This placeholder is disabled unless the operator chooses the profile.
  gateway:
    image: python:3.12-slim
    profiles: ["placeholder"]
    command: ["sh", "-c", "echo configure the real Crakbit gateway service; exit 1"]
    expose:
      - "9600"
    networks:
      - public_edge

networks:
  public_edge:
    driver: bridge
