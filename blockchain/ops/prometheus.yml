global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: crakbit-validators
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - host.docker.internal:9101
          - host.docker.internal:9102
          - host.docker.internal:9103
          - host.docker.internal:9104
