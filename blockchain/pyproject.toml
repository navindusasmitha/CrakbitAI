[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crakbit-chain"
version = "0.18.0a1"
description = "Crakbit Chain review-candidate alpha with native CometBFT state sync, signed evidence freeze, explorer reconciliation and sustained testnet evidence tooling"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
crakchain = "crakbit_chain.cli_v18:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crakbit_chain*"]

[tool.setuptools.package-data]
crakbit_chain = ["webui/*.html", "webui/*.css", "webui/*.js"]
