[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crakbit-chain"
version = "0.36.0a1"
description = "Crakbit Chain controlled public PoW testnet integration alpha with real-time campaign evidence, peer-book startup integration, incremental-undo rehearsal, activation proposals and review handoff tooling"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "build>=1.2.2"]

[project.scripts]
crakchain = "crakbit_chain.cli_v36_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crakbit_chain*"]

[tool.setuptools.package-data]
crakbit_chain = ["webui/*.html", "webui/*.css", "webui/*.js"]
