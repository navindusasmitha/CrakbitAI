[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crakbit-chain"
version = "0.26.0a1"
description = "Crakbit Chain independent-review remediation alpha with signed findings/retests, supply-chain and public-edge attestations, hard release gates and signed candidate re-freeze"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "build>=1.2.2"]

[project.scripts]
crakchain = "crakbit_chain.cli_v26_entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crakbit_chain*"]

[tool.setuptools.package-data]
crakbit_chain = ["webui/*.html", "webui/*.css", "webui/*.js"]
