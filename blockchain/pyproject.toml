[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crakbit-chain"
version = "0.12.0a1"
description = "Crakbit Chain history-sync, execution-boundary, monitoring-auth and adversarial-test development-network prototype"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
crakchain = "crakbit_chain.cli_v12:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crakbit_chain*"]
