name: Blockchain tests

on:
  push:
    paths:
      - "blockchain/**"
      - ".github/workflows/blockchain-tests.yml"
  pull_request:
    paths:
      - "blockchain/**"
      - ".github/workflows/blockchain-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        working-directory: blockchain
        run: pip install -e ".[dev]"
      - name: Python tests
        working-directory: blockchain
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: blockchain/cometbft-app/go.mod
      - name: CometBFT bridge tests
        working-directory: blockchain/cometbft-app
        shell: bash
        run: |
          set -o pipefail
          go mod download
          go test -mod=mod ./... 2>&1 | tee go-test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-test-output-${{ github.run_id }}
          path: |
            blockchain/pytest-output.txt
            blockchain/cometbft-app/go-test-output.txt
          if-no-files-found: warn
          retention-days: 7
