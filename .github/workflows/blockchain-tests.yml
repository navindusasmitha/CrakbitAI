name: Blockchain tests

on:
  push:
    paths:
      - "blockchain/**"
      - ".github/workflows/blockchain-tests.yml"
  pull_request:
    paths:
      - "blockchain/**"
      - ".github/workflows/blockchain-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: blockchain
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: blockchain
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-pytest-output-${{ github.run_id }}
          path: blockchain/pytest-output.txt
          if-no-files-found: warn
          retention-days: 7
