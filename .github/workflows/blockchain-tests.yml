name: Blockchain tests

on:
  push:
    paths:
      - "blockchain/**"
      - ".github/workflows/blockchain-tests.yml"
  pull_request:
    paths:
      - "blockchain/**"
      - ".github/workflows/blockchain-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        working-directory: blockchain
        run: pip install -e ".[dev]"
      - name: Python tests
        working-directory: blockchain
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: blockchain/cometbft-app/go.mod
      - name: CometBFT bridge tests
        working-directory: blockchain/cometbft-app
        shell: bash
        run: |
          set -o pipefail
          go mod download
          go test -mod=mod ./... 2>&1 | tee go-test-output.txt
      - name: Reproducible Python wheel check
        working-directory: blockchain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-a dist-b build crakbit_chain.egg-info
          export SOURCE_DATE_EPOCH="$(git -C .. log -1 --pretty=%ct)"
          python -m build --wheel --outdir dist-a
          rm -rf build crakbit_chain.egg-info
          python -m build --wheel --outdir dist-b
          wheel_name="$(basename "$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)")"
          test -n "$wheel_name"
          test -f "dist-b/$wheel_name"
          crakchain repro-compare \
            --left dist-a \
            --right dist-b \
            --file "$wheel_name" \
            --output reproducible-python-wheel.json
      - name: Reproducible Go bridge check
        working-directory: blockchain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf go-build-a go-build-b
          mkdir -p go-build-a go-build-b
          (cd cometbft-app && go build -trimpath -buildvcs=false -o ../go-build-a/crakbit-cometbft-bridge .)
          (cd cometbft-app && go build -trimpath -buildvcs=false -o ../go-build-b/crakbit-cometbft-bridge .)
          crakchain repro-compare \
            --left go-build-a \
            --right go-build-b \
            --file crakbit-cometbft-bridge \
            --output reproducible-go-bridge.json
      - name: Build direct dependency SBOM
        working-directory: blockchain
        shell: bash
        run: |
          mkdir -p release-evidence
          crakchain sbom-build \
            --repo-root .. \
            --output release-evidence/sbom.cdx.json
      - name: Upload test and release-engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-test-output-${{ github.run_id }}
          path: |
            blockchain/pytest-output.txt
            blockchain/cometbft-app/go-test-output.txt
            blockchain/reproducible-python-wheel.json
            blockchain/reproducible-go-bridge.json
            blockchain/release-evidence/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 7
