name: Scanner CI

on:
  push:
    paths:
      - 'scanner/**'
      - '.github/workflows/scanner-ci.yml'
  pull_request:
    paths:
      - 'scanner/**'
      - '.github/workflows/scanner-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install scanner and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./scanner[dev]"

      - name: Run scanner tests
        run: pytest -q scanner/tests

      - name: CLI smoke test
        run: crak scan scanner --json > /tmp/crakbit-scan.json || test $? -eq 1
