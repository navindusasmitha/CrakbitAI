[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crakbit-scanner"
version = "0.1.0a1"
description = "Early alpha defensive static-security scanner for Crakbit AI"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Crakbit AI"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crak = "crakbit_scanner.cli:main"

[tool.setuptools]
packages = ["crakbit_scanner"]
